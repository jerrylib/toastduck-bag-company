<!DOCTYPE html>
<html class="wide wow-animation" lang="en">
  <head>
    <!-- SEO - Title (50-60 characters) -->
    <title>Toastduck International Business Co., Ltd. - Professional Import & Export Services</title>
    <meta name="description" content="Toastduck International Business Co., Ltd. is a professional trading company based in Hong Kong, specializing in e-commerce, electronic components, hardware, clothing, footwear, bags, and sports equipment import and export. Serving clients worldwide with quality products and reliable service." />
    <meta name="format-detection" content="telephone=no" />
    <meta name="keywords" content="Toastduck, international trade, import export, e-commerce, electronic components, hardware, clothing, footwear, bags, sports equipment, Hong Kong company, trading company" />
    <meta
      name="viewport"
      content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta charset="utf-8" />
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon" />

    <!-- SEO - Structured Data (JSON-LD Schema) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Toastduck International Business Co., Limited",
      "alternateName": "多士達國際商務有限公司",
      "url": "https://toastduck.com",
      "logo": "https://toastduck.com/images/logo-201x46.png",
      "description": "Toastduck International Business Co., Ltd. is a professional trading company based in Hong Kong, specializing in e-commerce, electronic components, hardware, clothing, footwear, bags, and sports equipment import and export.",
      "foundingDate": "2023",
      "foundingLocation": {
        "@type": "Place",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Hong Kong",
          "addressCountry": "HK"
        }
      },
      "numberOfEmployees": {
        "@type": "QuantitativeValue",
        "value": "10"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "email": "info@toastduck.com"
      },
      "sameAs": []
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Toastduck International Business",
      "url": "https://toastduck.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://toastduck.com/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Stylesheets-->
    <link
      rel="stylesheet"
      type="text/css"
      href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700,900"
    />
    <link rel="stylesheet" href="/css/bootstrap.css" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/fonts.css" />

    <!-- GitHub Pages SPA redirect handling -->
    <script>
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Javascript-->
    <script src="/js/core.min.js"></script>
    <script src="/js/script.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
